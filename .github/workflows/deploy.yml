# =============================================================================
# GitHub Actions - Deploy to GitHub Pages
# Marble Analyst - Next.js Static Export Deployment
# =============================================================================

name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']
  
  # Allows manual trigger from Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Debug - Check environment variables
        run: |
          echo "Checking if secrets are set..."
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "❌ ERROR: NEXT_PUBLIC_SUPABASE_URL is NOT set!"
            echo "Please add this secret in GitHub repo Settings > Secrets > Actions"
            exit 1
          else
            echo "✅ NEXT_PUBLIC_SUPABASE_URL is set (value hidden for security)"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "❌ ERROR: NEXT_PUBLIC_SUPABASE_ANON_KEY is NOT set!"
            echo "Please add this secret in GitHub repo Settings > Secrets > Actions"
            exit 1
          else
            echo "✅ NEXT_PUBLIC_SUPABASE_ANON_KEY is set (value hidden for security)"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      # Add .nojekyll to prevent Jekyll processing
      - name: Add .nojekyll file
        run: touch out/.nojekyll
      
      # Upload artifact for Pages deployment
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
